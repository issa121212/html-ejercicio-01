<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSitter - Registro</title>
    <link rel="icon" type="image/jpeg" href="imgs/logo-marca.jpeg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
  <div class="tarjeta-formulario">
    <form id="form-registro">
      <h2 class="has-text-centered is-size-3 has-text-weight-bold mb-4">PetSitter 🐾</h2>

      <div class="fila campo">
        <div class="columna">
          <label for="nombre">Nombres</label>
          <input id="nombre" name="nombre" class="input" type="text" placeholder="Ej: Daniel">
        </div>
        <div class="columna">
          <label for="apellido">Apellidos</label>
          <input id="apellido" name="apellido" class="input" type="text" placeholder="Ej: González">
        </div>
      </div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" class="input" type="email" placeholder="Ej: javier@gmail.com">
      </div>

      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" class="input" type="tel" placeholder="Ej: 912345678">
      </div>

      <div class="campo">
        <label for="rut">RUT</label>
        <input id="rut" name="rut" class="input" type="text" placeholder="Ej: 12.345.678-5">
      </div>

      <div class="campo">
        <label>Sexo</label>
        <div class="opciones-genero">
          <label class="opcion-btn">
            <input type="radio" name="genero" value="masculino">
            <span>Masculino</span>
          </label>
          <label class="opcion-btn">
            <input type="radio" name="genero" value="femenino">
            <span>Femenino</span>
          </label>
          <label class="opcion-btn">
            <input type="radio" name="genero" value="otro">
            <span>Otro</span>
          </label>
        </div>
      </div>
      
      <div class="fila campo">
        <div class="columna">
          <label for="password">Contraseña</label>
          <input id="password" name="password" class="input" type="password" placeholder="Mínimo 8 caracteres">
        </div>
        <div class="columna">
          <label for="confirm-password">Confirmar Contraseña</label>
          <input id="confirm-password" name="confirm-password" class="input" type="password" placeholder="Repetir contraseña">
        </div>
      </div>

      <button type="submit" class="button is-info is-fullwidth mt-4" id="btn-submit">Registrar</button>

      <p class="has-text-centered mt-3 is-size-7">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a> · <a href="index.html">Volver al inicio</a>
      </p>
    </form>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
